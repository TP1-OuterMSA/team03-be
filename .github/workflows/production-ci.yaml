name: Production Deploy

on:
  pull_request:
    types: [closed]
    branches:
      - 'production-test'

jobs:
  deploy-to-production:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-2
      ECR_REPO: 809691348554.dkr.ecr.ap-northeast-2.amazonaws.com/team03-be-production-repo
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t $ECR_REPO:$IMAGE_TAG .
          docker push $ECR_REPO:$IMAGE_TAG

      - name: Checkout ec2-infra-be repo
        uses: actions/checkout@v4
        with:
          repository: TP1-OuterMSA/ec2-infra-be
          token: ${{ secrets.EC2_INFRA_REPO_TOKEN }}
          path: ec2-infra-be

      - name: Update values.yaml with new image tag
        run: |
          cd ec2-infra-be/charts/services/team03-be
          sed -i "s/tag: .*/tag: ${IMAGE_TAG}/" values.yaml

      - name: Commit and push updated values.yaml
        run: |
          cd ec2-infra-be
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/services/team03-be/values.yaml
          git commit -m "ci: update team03-be image tag to ${IMAGE_TAG}"
          git push origin main
