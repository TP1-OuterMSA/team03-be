name: Production Deploy

on:
  push:
    branches:
      - 'production'

env:
  APP_ENV: production
  AWS_REGION: ap-northeast-2

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password | docker login --username AWS \
            --password-stdin 809691348554.dkr.ecr.ap-northeast-2.amazonaws.com

      - name: Build and Push Docker Image
        run: |
          docker build -t team03-be .
          docker tag team03-be:latest 809691348554.dkr.ecr.ap-northeast-2.amazonaws.com/team03-be-production-repo:sha-${SHORT_SHA}
          docker push 809691348554.dkr.ecr.ap-northeast-2.amazonaws.com/team03-be-production-repo:sha-${SHORT_SHA}

      - name: Update Helm values.yaml
        run: |
          git clone https://github.com/TP1-OuterMSA/ec2-infra-be.git
          cd ec2-infra-be/charts/services/team03-be
          sed -i "s/tag: \".*\"/tag: \"sha-${SHORT_SHA}\"/" values.yaml

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add values.yaml
          git commit -m "chore(team03-be): Update tag to sha-${SHORT_SHA}"
          git push origin main
